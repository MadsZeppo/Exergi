# Replace the non-secret client ID and URLs through Shopify CLI/Dev Dashboard per environment.
client_id = "REPLACE_WITH_SHOPIFY_CLIENT_ID"
name = "Exergi"
application_url = "https://api.example.exergi.app/api/v1/shopify/install"
embedded = false

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_customers,read_inventory,read_orders,read_products,read_returns"

[auth]
redirect_urls = ["https://api.example.exergi.app/api/v1/shopify/oauth/callback"]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/api/v1/shopify/webhooks"

[[webhooks.subscriptions]]
topics = ["app/uninstalled", "orders/create", "orders/updated", "orders/cancelled", "refunds/create", "products/create", "products/update", "products/delete"]
uri = "/api/v1/shopify/webhooks"
