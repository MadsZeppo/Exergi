services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: commercial_twin
      POSTGRES_USER: commercial_twin
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commercial_twin"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - merchant_validation_pg:/var/lib/postgresql/data

volumes:
  merchant_validation_pg:
