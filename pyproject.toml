[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-engine"
version = "0.1.0"
description = "Leak-safe forecasting, causal benchmarking, and economic decision engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16",
  "cryptography>=45",
  "duckdb>=1.0",
  "fastapi>=0.116",
  "lightgbm>=4.3",
  "numpy>=1.26",
  "polars>=1.0",
  "psycopg[binary]>=3.2",
  "pyarrow>=16",
  "pyreadr>=0.5.3",
  "pydantic>=2.7",
  "PyYAML>=6",
  "pytz>=2024.1",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "sqlalchemy>=2.0",
  "streamlit>=1.40",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
causal = ["econml>=0.15", "dowhy>=0.11", "statsmodels>=0.14"]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/decision_engine", "src/commercial_twin", "src/domains"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["decision_engine", "commercial_twin", "domains"]
ignore_missing_imports = true
disable_error_code = ["no-any-return"]
